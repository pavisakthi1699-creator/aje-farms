services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aje
      POSTGRES_PASSWORD: aje
      POSTGRES_DB: aje_farms
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U aje -d aje_farms']
      interval: 2s
      timeout: 5s
      retries: 15
